# Ingress unico exposto na LAN via Traefik (k3s built-in).
# Acesso a partir de qualquer maquina da LAN: http://<IP-PC1>/
#   /          -> escolar-ui  (Angular)
#   /api/*     -> api-gateway (Spring Cloud Gateway)
#
# Eureka dashboard e Zipkin sao acessados via kubectl port-forward
# no PC-1 durante a demo (rotas com path rewrite quebram os assets desses
# dashboards, entao mantemos eles acessiveis localmente apenas).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: escolar-ingress
  namespace: escolar
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: escolar-ui
                port:
                  number: 80
